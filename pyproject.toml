[project]
name = "call-center-admin"
version = "0.1.0"
description = "콜센터 STT 자동 분류 시스템 (Phase 1)"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5",
  "boto3>=1.35.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "moto[all]>=5.0.0",
  # ruff 는 formatter 재현성을 위해 정확히 핀한다. 범위 핀(`>=`)은 patch 릴리스마다
  # `ruff format` 출력이 달라져(예: 0.15.14 ↔ 0.15.15 의 list 래핑 차이) 로컬 통과
  # 하지만 CI `ruff format --check` 가 실패하는 드리프트를 유발했다(PR #26 사례).
  # 버전 상향 시 이 한 줄을 올리고 `ruff format` 재실행 → 동일 diff 를 커밋.
  "ruff==0.15.15",
  "mypy>=1.11.0",
  "boto3-stubs[bedrock-runtime,dynamodb,s3,sagemaker]>=1.35.0",
  "types-openpyxl>=3.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"

[tool.mypy]
strict = true
python_version = "3.12"

# HITL UI Streamlit 진입점/페이지는 동적 페이지 등록 + Streamlit stub 부재로
# strict 검사 의미 낮음. hitl_lib/ 만 strict 유지 (DDB / auth 핵심 로직).
exclude = [
  'src/hitl_ui/streamlit_app\.py$',
  'src/hitl_ui/pages/',
]

# Bedrock Converse 의 cachePoint 필드는 boto3-stubs 의 SystemContentBlockTypeDef
# TypedDict 에 아직 포함되지 않아 strict 모드에서 충돌. lib/bedrock_client.py 에서만
# untyped dict 허용. Bedrock-stubs 가 cachePoint 를 정식 지원하면 제거.
[[tool.mypy.overrides]]
module = "lib.bedrock_client"
disallow_untyped_calls = false
disallow_subclassing_any = false

# PyJWT / cryptography 는 Python 3.9 로컬 환경에서 stub 없을 수 있음.
# 컨테이너 build 시 requirements.txt 에서 설치되므로 실제 runtime 영향 없음.
[[tool.mypy.overrides]]
module = ["jwt", "cryptography.*"]
ignore_missing_imports = true

# moto + 한국어 attribute name 으로 인한 false-positive 가 많아 unit/integration
# 테스트는 strict 완화. test 코드는 핸들러의 mock 행동 검증이 목적이지 typed API 가 아님.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

# Streamlit 은 stub 패키지가 없어 import-not-found 가 strict 모드에서 발생.
# hitl_lib/auth.py 의 `import streamlit as st` 만 영향. (streamlit_app.py 와
# pages/ 는 위의 [tool.mypy].exclude 로 처리되어 본 override 가 중복이지 않음)
[[tool.mypy.overrides]]
module = "streamlit"
ignore_missing_imports = true
