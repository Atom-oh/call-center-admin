[project]
name = "call-center-admin"
version = "0.1.0"
description = "콜센터 STT 자동 분류 시스템 (Phase 1)"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5",
  "boto3>=1.35.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "moto[all]>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "boto3-stubs[bedrock-runtime,dynamodb,s3,sagemaker]>=1.35.0",
  "types-openpyxl>=3.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"

[tool.mypy]
strict = true
python_version = "3.12"

# HITL UI Streamlit 진입점/페이지는 동적 페이지 등록 + Streamlit stub 부재로
# strict 검사 의미 낮음. hitl_lib/ 만 strict 유지 (DDB / auth 핵심 로직).
exclude = [
  'src/hitl_ui/streamlit_app\.py$',
  'src/hitl_ui/pages/',
]

# Bedrock Converse 의 cachePoint 필드는 boto3-stubs 의 SystemContentBlockTypeDef
# TypedDict 에 아직 포함되지 않아 strict 모드에서 충돌. lib/bedrock_client.py 에서만
# untyped dict 허용. Bedrock-stubs 가 cachePoint 를 정식 지원하면 제거.
[[tool.mypy.overrides]]
module = "lib.bedrock_client"
disallow_untyped_calls = false
disallow_subclassing_any = false

# moto + 한국어 attribute name 으로 인한 false-positive 가 많아 unit/integration
# 테스트는 strict 완화. test 코드는 핸들러의 mock 행동 검증이 목적이지 typed API 가 아님.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

# Streamlit 은 stub 패키지가 없고 (types-streamlit 부재) HITL UI 의 페이지/엔트리는
# 동적 페이지 등록 패턴이라 strict 검사 의미 낮음. hitl_lib 만 strict 유지.
[[tool.mypy.overrides]]
module = "streamlit"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["streamlit_app", "pages.*"]
ignore_errors = true
