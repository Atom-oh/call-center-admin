name: Terraform Apply (main → dev)

# main 브랜치에 머지될 때 infra/** 변경이 있으면 dev 환경에 `terraform apply` 실행.
# stg/prd 는 별도 workflow_dispatch 로만 트리거 — 자동 promotion 안 함.
#
# 보안 게이트:
#   1. main 브랜치만 트리거 (PR head 직접 금지)
#   2. `environment: dev` 보호 룰로 reviewer 승인 필요 (GitHub UI 에서 설정)
#   3. OIDC role `callcenter-github-actions-tf-apply-dev` 가 dev account에만 권한
#
# stg/prd 는 `workflow_dispatch` 의 environment input 으로 명시적 선택 필요 +
# 별도 OIDC role + 별도 GitHub environment 보호 룰.

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev / stg / prd)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prd

permissions:
  contents: read
  id-token: write

concurrency:
  # dev/stg/prd 각각 독립 그룹. cancel-in-progress: false — apply 중단 위험 회피.
  group: tf-apply-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  apply:
    name: terraform apply — ${{ github.event.inputs.environment || 'dev' }}
    if: vars.AWS_ACCOUNT_ID != ''
    runs-on: call-center-admin-x86
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine target env
        id: env
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ -z "$ENV" ]; then
            ENV="dev"
          fi
          echo "target=$ENV" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/callcenter-github-actions-tf-apply-${{ steps.env.outputs.target }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false   # node 의존 제거 — self-hosted 러너 안정성

      - name: terraform init
        working-directory: infra/envs/${{ steps.env.outputs.target }}
        run: terraform init -reconfigure

      - name: terraform plan (with -out)
        working-directory: infra/envs/${{ steps.env.outputs.target }}
        run: |
          terraform plan -no-color -out=tfplan.binary
          terraform show -no-color tfplan.binary > /tmp/tf-plan.txt
          head -c 5000 /tmp/tf-plan.txt

      - name: terraform apply
        working-directory: infra/envs/${{ steps.env.outputs.target }}
        run: terraform apply -auto-approve tfplan.binary

      - name: Smoke test (dev only)
        if: steps.env.outputs.target == 'dev'
        run: |
          # Confirm key resources came up
          aws stepfunctions describe-state-machine \
            --state-machine-arn "$(terraform -chdir=infra/envs/dev output -raw sfn_arn 2>/dev/null || echo '')" \
            --query 'name' --output text || echo "SFN check skipped (output not yet wired)"
          aws dynamodb describe-table \
            --table-name "$(terraform -chdir=infra/envs/dev output -raw ddb_consult_name)" \
            --query 'Table.TableStatus' --output text

      - name: Apply summary
        if: always()
        run: |
          echo "## Terraform Apply — ${{ steps.env.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by**: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
