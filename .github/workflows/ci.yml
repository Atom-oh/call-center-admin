name: CI — Lint, Test, Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: call-center-admin-arm
    outputs:
      python: ${{ steps.changes.outputs.python }}
      terraform: ${{ steps.changes.outputs.terraform }}
      taxonomy: ${{ steps.changes.outputs.taxonomy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'ruff.toml'
            terraform:
              - 'infra/**'
            taxonomy:
              - '상담어시스트_AWS전달자료.xlsx'
              - 'src/lib/taxonomy.py'
              - 'src/prompts/**'

  python:
    name: Python — lint, mypy, pytest
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: call-center-admin-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
      - name: Mypy strict
        run: mypy src
      - name: Pytest with coverage
        run: pytest -v --cov=src --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  terraform-validate:
    name: Terraform — fmt + validate (offline)
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: call-center-admin-arm
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false   # node 의존 제거 — self-hosted 러너 안정성
      - name: terraform fmt -recursive -check
        run: terraform fmt -recursive -check infra/
      - name: tflint
        run: |
          curl -L -o /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip
          unzip -o /tmp/tflint.zip -d /tmp && sudo mv /tmp/tflint /usr/local/bin/
          tflint --init >/dev/null 2>&1 || true
          tflint -f compact --chdir=infra/envs/dev || true
      - name: terraform validate (dev)
        run: |
          terraform -chdir=infra/envs/dev init -backend=false -reconfigure
          terraform -chdir=infra/envs/dev validate
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
          soft_fail: true   # informational while Phase 1 IAM still has documented broad scopes

  taxonomy-regeneration-check:
    name: Taxonomy artifacts up to date
    needs: detect-changes
    if: needs.detect-changes.outputs.taxonomy == 'true'
    runs-on: call-center-admin-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install openpyxl
        run: pip install openpyxl
      - name: Regenerate taxonomy artifacts and check diff
        run: |
          python3 scripts/parse_taxonomy.py --xlsx 상담어시스트_AWS전달자료.xlsx
          if ! git diff --quiet src/prompts/v1.0/taxonomy_tree.json src/prompts/v1.0/taxonomy_tree.md; then
            echo "::error::Taxonomy artifacts are stale. Re-run 'python3 scripts/parse_taxonomy.py' and commit the result."
            git --no-pager diff --stat src/prompts/v1.0/
            exit 1
          fi
          echo "Taxonomy artifacts are up to date."
