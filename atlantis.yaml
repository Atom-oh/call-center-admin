# Atlantis configuration for call-center-admin.
# Replaces .github/workflows/terraform-{plan,apply}.yml.
#
# Server: https://<ATLANTIS_SERVER_URL>  (running on <INFRA_REPO> hub EKS)
# GitHub App: <ATLANTIS_GITHUB_APP> (webhook auth, no per-repo PAT needed)
# Repo allowlist: github.com/Atom-oh/*  (already satisfied)
#
# Workflow:
#   1. Open a PR that touches infra/**         → Atlantis auto-runs `plan`, posts to PR
#   2. Comment `atlantis plan` to re-run        (or `atlantis plan -p dev`)
#   3. Comment `atlantis apply` after review    (or `atlantis apply -p dev`)
#   4. Merge PR
#
# IMPORTANT — IAM PREREQUISITE:
# The Atlantis pod runs as IRSA `<ATLANTIS_IRSA_ROLE>` (in account <ACCOUNT_ID>).
# To drive Terraform here, one of the following must be set up:
#
#   Option A (recommended): grant <ATLANTIS_IRSA_ROLE> permission to AssumeRole into
#     `callcenter-github-actions-tf-plan` and `callcenter-github-actions-tf-apply-dev`
#     (and the stg/prd equivalents), then add an `assume_role` block to the
#     provider in each env's main.tf:
#
#         provider "aws" {
#           region = "ap-northeast-2"
#           assume_role { role_arn = "arn:aws:iam::<acct>:role/callcenter-...-tf-apply-dev" }
#         }
#
#   Option B: extend <ATLANTIS_IRSA_ROLE>'s policy with the resource permissions
#     this project needs (Bedrock, Lambda, SFN, S3, DDB, KMS, etc.) — less clean
#     but avoids the trust-policy edit.
#
# Without one of these, `terraform plan` will fail with credentials errors.

version: 3
automerge: false
parallel_plan: false
parallel_apply: false
delete_source_branch_on_merge: false

projects:
  # dev env uses the shared tfstate bucket `<YOUR_TFSTATE_BUCKET>`
  # (ap-northeast-2). The bucket is CLI-bootstrapped one-time outside
  # Terraform — see docs/operations/atlantis-setup.md.
  # Key prefix: call-center-admin/envs/dev.tfstate
  # No DDB lock — non-prod / single operator.
  - name: dev
    dir: infra/envs/dev
    workspace: default
    terraform_version: v1.9.6
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "../../modules/**/*.tf"
        - "../../../atlantis.yaml"
    apply_requirements:
      - mergeable

  # stg env — created by PR #15. Key prefix: call-center-admin/envs/stg.tfstate.
  # autoplan enabled so any infra change is dry-run against stg too. apply
  # gated on approved + mergeable (vs dev which only requires mergeable).
  - name: stg
    dir: infra/envs/stg
    workspace: default
    terraform_version: v1.9.6
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "../../modules/**/*.tf"
        - "../../../atlantis.yaml"
    apply_requirements:
      - approved
      - mergeable

  # prd env — created by PR #15. Key prefix: call-center-admin/envs/prd.tfstate.
  # apply requires approval + mergeable (strictest gate).
  - name: prd
    dir: infra/envs/prd
    workspace: default
    terraform_version: v1.9.6
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "../../modules/**/*.tf"
        - "../../../atlantis.yaml"
    apply_requirements:
      - approved
      - mergeable

# Custom workflows are NOT declared here. The server-side repos.yaml
# (in Atom-oh/<INFRA_REPO>: k8s/system/atlantis/configmap.yaml)
# declares the `standard` workflow which all projects above use by default.
# To declare custom workflows in this file, the server-side repo config
# for github.com/Atom-oh/call-center-admin would need
# `allow_custom_workflows: true`.
