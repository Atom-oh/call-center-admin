# Atlantis configuration for call-center-admin.
# Replaces .github/workflows/terraform-{plan,apply}.yml.
#
# Server: <your Atlantis server URL>  (e.g. running on an EKS hub cluster)
# GitHub App: <your Atlantis GitHub App>  (webhook auth, no per-repo PAT needed)
# Repo allowlist: configured server-side.
#
# Workflow:
#   1. Open a PR that touches infra/**         → Atlantis auto-runs `plan`, posts to PR
#   2. Comment `atlantis plan` to re-run        (or `atlantis plan -p dev`)
#   3. Comment `atlantis apply` after review    (or `atlantis apply -p dev`)
#   4. Merge PR
#
# IMPORTANT — IAM PREREQUISITE:
# The Atlantis runner needs permission to manage this project's resources. Either:
#
#   Option A (recommended): give the Atlantis identity AssumeRole into a
#     dedicated terraformer role, then set `terraformer_role_arn` +
#     `terraformer_external_id_secret` in each env's terraform.tfvars
#     (git-ignored). The provider blocks already wire these in.
#
#   Option B: attach the resource permissions this project needs (Bedrock,
#     Lambda, SFN, S3, DDB, KMS, etc.) directly to the Atlantis identity.
#
# Without one of these, `terraform plan` fails with credentials errors.

version: 3
automerge: false
parallel_plan: false
parallel_apply: false
delete_source_branch_on_merge: false

projects:
  # dev env tfstate lives in an S3 bucket supplied via partial backend config
  # (backend.hcl, git-ignored). The bucket is CLI-bootstrapped one-time outside
  # Terraform — see docs/operations/atlantis-setup.md.
  # Key prefix: call-center-admin/envs/dev.tfstate
  # No DDB lock — non-prod / single operator.
  - name: dev
    dir: infra/envs/dev
    workspace: default
    terraform_version: v1.9.6
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "../../modules/**/*.tf"
        - "../../../atlantis.yaml"
    apply_requirements:
      - mergeable

  # stg env — created by PR #15. Key prefix: call-center-admin/envs/stg.tfstate.
  # autoplan enabled so any infra change is dry-run against stg too. apply
  # gated on approved + mergeable (vs dev which only requires mergeable).
  - name: stg
    dir: infra/envs/stg
    workspace: default
    terraform_version: v1.9.6
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "../../modules/**/*.tf"
        - "../../../atlantis.yaml"
    apply_requirements:
      - approved
      - mergeable

  # prd env — created by PR #15. Key prefix: call-center-admin/envs/prd.tfstate.
  # apply requires approval + mergeable (strictest gate).
  - name: prd
    dir: infra/envs/prd
    workspace: default
    terraform_version: v1.9.6
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "../../modules/**/*.tf"
        - "../../../atlantis.yaml"
    apply_requirements:
      - approved
      - mergeable

# Custom workflows are NOT declared here. The server-side repo config
# (Atlantis repos.yaml / configmap) declares the `standard` workflow which all
# projects above use by default. To declare custom workflows in this file, the
# server-side repo config for this repository would need
# `allow_custom_workflows: true`.
